# Publishes the website (site/) to GitHub Pages on every push to main.
name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build pages
        run: python3 site/build.py
      - name: Package (published files only)
        run: |
          mkdir -p _site
          cp site/*.html site/*.css site/*.js _site/
          cp -r site/assets site/fonts _site/
          rm -f _site/_*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
